name: Watchdog prototype tests
# Feature/research branches are tested through their pull requests.
# Direct pushes to main still receive tests. Avoid running both events per edit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only the latest revision of a PR needs to complete this workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mock-only-watchdog:
    name: mock watchdog / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run watchdog and Windhawk adapter tests (mock only)
        env:
          ATB_WATCHDOG_TEST_MODE: "1"
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Compile native lease protocol tests
        run: g++ -std=c++17 -Wall -Wextra -pedantic -Werror -I. tests/lease_v1_tests.cpp -o lease_v1_tests.exe
      - name: Run native lease protocol tests
        run: ./lease_v1_tests.exe
      - name: Compile Python-to-C++ lease probe
        run: g++ -std=c++17 -Wall -Wextra -pedantic -Werror -I. tests/lease_file_probe.cpp -o lease_file_probe.exe
      - name: Test Python publisher against native lease reader
        env:
          ATB_WATCHDOG_TEST_MODE: "1"
          ATB_NATIVE_LEASE_PROBE: "./lease_file_probe.exe"
        run: python -m unittest discover -s tests -p "test_lease_interop.py" -v
      - name: Compile Stage-1e portable IPC protocol
        run: g++ -std=c++17 -Wall -Wextra -pedantic -Werror -I. tests/ipc_protocol_tests.cpp -o ipc_protocol_tests.exe
      - name: Test Stage-1e portable IPC protocol
        run: ./ipc_protocol_tests.exe
      - name: Compile Windows-native named pipe diagnostic (NO shell changes)
        if: runner.os == 'Windows'
        run: g++ -std=c++17 -Wall -Wextra -pedantic -Werror -D_WIN32_WINNT=0x0A00 -I. native/ipc_probe_win.cpp -o ipc_probe_win.exe -lbcrypt -ladvapi32
      - name: Verify native named-pipe client identity, HMAC and replay rejection
        if: runner.os == 'Windows'
        env:
          ATB_NATIVE_IPC_PROBE: "./ipc_probe_win.exe"
        run: python -m unittest discover -s tests -p "test_native_ipc.py" -v
