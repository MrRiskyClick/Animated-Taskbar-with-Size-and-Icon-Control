name: Watchdog prototype tests
on:
  push:
    branches: [main, "research/**", "feature/**"]
  pull_request:

jobs:
  mock-only-watchdog:
    name: mock watchdog / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run watchdog and Windhawk adapter tests (mock only)
        env:
          ATB_WATCHDOG_TEST_MODE: "1"
        run: python -m unittest discover -s tests -p "test_*.py" -v
