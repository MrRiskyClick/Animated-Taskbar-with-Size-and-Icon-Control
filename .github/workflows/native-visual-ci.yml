name: Native visual engine — GitHub-only validation

on:
  push:
    branches:
      - feature/full-native-mod-integration-v1
  pull_request:
    paths:
      - 'experiments/**'
      - 'tests/**'
      - '.github/workflows/native-visual-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-motion:
    name: Portable animation math (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute original motion tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -O2 tests/dock_motion_tests.cpp -o /tmp/dock-motion-tests
          /tmp/dock-motion-tests
      - name: Compile and execute native two-pass spacing tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -O2 tests/native_two_pass_geometry_tests.cpp -o /tmp/native-spacing-tests
          /tmp/native-spacing-tests
      - name: Test reserved strip and visual hit-region geometry
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -O2 tests/test_taskbar_regions.cpp -o /tmp/atb-region-tests
          /tmp/atb-region-tests
      - name: Static guard for development-only native mod
        run: python3 tests/test_native_mod_contract.py

  windows-safety-fixture:
    name: Windows mock watchdog and motion fixtures
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build and run collision geometry tests
        shell: pwsh
        run: |
          clang++ -std=c++17 -O2 tests/native_two_pass_geometry_tests.cpp -o "$env:RUNNER_TEMP/native-spacing.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Geometry compilation failed' }
          & "$env:RUNNER_TEMP/native-spacing.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Geometry test failed' }
      - name: Compile and execute disposable owned-HWND appbar/window height probe
        shell: pwsh
        run: |
          & clang++ -std=c++17 -O2 tests/win32_disposable_appbar.cpp -o "$env:RUNNER_TEMP/atb-owned-appbar.exe" -lshell32 -luser32
          if ($LASTEXITCODE -ne 0) { throw 'Owned appbar probe compilation failed' }
          & "$env:RUNNER_TEMP/atb-owned-appbar.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Owned appbar probe failed' }
      - name: Parse watchdog PowerShell without executing outside fixture
        shell: pwsh
        run: |
          $t = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path (Get-Location) 'experiments/run-visual-trial-watchdog.ps1'),
            [ref]$t, [ref]$errors
          )
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }
      - name: Run isolated mock watchdog (never targets Explorer)
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File experiments/run-visual-trial-watchdog.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Self-test failed' }
          $fixtures = @(Get-ChildItem -Path $env:TEMP -Directory -Filter 'atb-dev-selftest-*' -ErrorAction SilentlyContinue)
          if ($fixtures.Count -ne 1) { throw "Expected one self-test fixture; found $($fixtures.Count)" }
          $last = Get-Content -LiteralPath (Join-Path $fixtures[0].FullName 'lease.v1') -Raw
          if ($last.Trim() -ne 'REVOKED') { throw 'Self-test lease not revoked' }
          if (Test-Path (Join-Path $env:LOCALAPPDATA 'AnimatedTaskbarTrial/lease.v1')) {
            throw 'Self-test improperly created a real trial lease'
          }
      - name: Validate native source guard contract
        shell: pwsh
        run: python tests/test_native_mod_contract.py

  windhawk-compiler:
    name: Windhawk 1.7.3 official Clang DLL compilation
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cache verified official Windhawk compiler
        uses: actions/cache@v4
        id: windhawk-cache
        with:
          path: ${{ runner.temp }}/windhawk
          key: windhawk-portable-1.7.3-compiler-v1
      - name: Download pinned Windhawk installer and extract portable tools
        if: steps.windhawk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          installer="${{ runner.temp }}/windhawk_setup.exe"
          curl --fail --location --retry 3 'https://github.com/ramensoftware/windhawk/releases/download/v1.7.3/windhawk_setup.exe' -o "$installer"
          printf '%s  %s\n' '5116cc1703384aac88b8d7a3b57f172aea5da32b6df7355fb2f8247d23813c8f' "$installer" | sha256sum -c -
          MSYS_NO_PATHCONV=1 "$installer" /S /PORTABLE "/D=${{ runner.temp }}\\windhawk"
      - name: Compile and link the native mod without loading it
        shell: pwsh
        run: |
          $base = Join-Path $env:RUNNER_TEMP 'windhawk'
          $compiler = Join-Path $base 'Compiler/bin/clang++.exe'
          $flags = Join-Path $base 'Compiler/compile_flags.txt'
          $headers = Join-Path $base 'Compiler/include'
          if (-not (Test-Path $compiler)) { throw "Windhawk compiler extraction incomplete: $compiler" }
          if (-not (Test-Path $flags)) { throw "Windhawk flags missing" }
          $source = Join-Path (Get-Location) 'experiments/atb-native-visual-trial.wh.cpp'
          $output = Join-Path $env:RUNNER_TEMP 'atb-native-trial.dll'
          & $compiler "@$flags" "-I$headers" -shared -o $output $source -lole32 -loleaut32 -lruntimeobject -lshcore -lwindowsapp -luser32
          if ($LASTEXITCODE -ne 0) { throw "Native Windhawk build failed" }
          if (-not (Test-Path $output)) { throw "Compiled DLL missing" }
          $hash = (Get-FileHash -LiteralPath $output -Algorithm SHA256).Hash
          Write-Host "WINDSHA256=$hash"
          Write-Host "DLL compiled for isolated GitHub CI only; never installed or run."
