[package]
name = "atb-rust-dock"
version = "0.5.0"
edition = "2021"
description = "Native Windows taskbar companion with animated icons and DWM hover previews"
license = "GPL-3.0-or-later"

# Windows-only crates: keep Linux portable tests free of Win32 COM/WinRT dependencies.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.2", features = ["Win32_UI_Accessibility", "Win32_System_Com", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_Foundation"] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_Environment",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
lto = "thin"
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true
