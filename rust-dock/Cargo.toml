[package]
name = "atb-rust-dock"
version = "0.1.0"
edition = "2021"
description = "Native Windows taskbar companion with animated icons and DWM hover previews"
license = "GPL-3.0-or-later"

[dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_UI_Controls",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
lto = "thin"
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true
